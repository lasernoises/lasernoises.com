{% extends "base.html" %}

{% block main_content %}
    <main>
        <article>
            <section class="body">
                {{ <page_header title={section.title} /> }}
                {{ section.content | safe }}
            </section>
        </article>
    </main>

    <h1>Recent posts</h1>
    <main class="post-list">
        {% set blog = get_section(path="blog/_index.md") %}
        {{ <list_posts pages={blog.pages[:5]} /> }}
    </main>
{% endblock main_content %}
