{% extends "index.html" %}

{% block main_content %}
    {% if term.name %}
        <div class="page-header">
            Entries tagged :: {{ term.name }}
        </div>
    {% else %}
        <div class="page-header">
            All articles
        </div>
    {% endif %}

    <main class="post-list">
        {{ <list_posts pages={term.pages} /> }}
    </main>
{% endblock main_content %}
